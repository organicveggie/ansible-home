---
###
### Docker
###
r740xd_docker_zfs_dataset: "data/docker"
r740xd_docker_home: "/{{ r740xd_docker_zfs_dataset }}"

###
### Home Assistant
###
hass_ecowitt_hass_auth_token: "{{ vault_hass_ecowitt_hass_auth_token }}"
hass_ecowitt_hass_webhook_id: "{{ vault_hass_ecowitt_hass_webhook_id }}"
hass_zwave_device: "{{ vault_hass_zwave_device }}"

###
### Kometa
###
kometa_cpus: "4"
kometa_memory: "4G"
kometa_timezone: "{{ home_timezone }}"

kometa_global_save_report: true
kometa_mdblist_apikey: "{{ vault_kometa_mdblist_apikey }}"
kometa_mdblist_cache_expiration: "60"
kometa_plex_db_cache: "2048" # MB
kometa_plex_token: "{{ vault_kometa_plex_token }}"
kometa_tmdb_apikey: "{{ vault_kometa_tmdb_apikey }}"
kometa_tmdb_language: "en"
kometa_tmdb_region: "US"
kometa_tautulli_apikey: "{{ vault_kometa_tautulli_apikey }}"
kometa_libraries: |2
    Movies:
      schedule: daily
      report_path: /config/reports/Movies-1080p.yml
      template_variables:
        language: "en"
      collection_files:
        - default: actor
          schedule: weekly(monday)
        - default: basic
          schedule: weekly(wednesday)
        - default: bafta
          schedule: weekly(friday)
        - default: cannes
          schedule: weekly(monday)
        - default: decade
          schedule: weekly(wednesday)
        - default: director
          schedule: weekly(friday)
        - default: franchise
          schedule: weekly(monday)
          template_variables:
            data:
              visible_home: true
        - default: genre
          schedule: weekly(wednesday)
          template_variables:
            data:
              visible_home: true
        - default: imdb
          schedule: weekly(friday)
        - default: oscars
          schedule: weekly(monday)
          template_variables:
            data:
              starting: current_year-10
              ending: current_year
        - default: seasonal
          schedule: weekly(wednesday)
          template_variables:
            data:
              visible_home: true
        - default: streaming
          schedule: weekly(friday)
        - default: sundance
          schedule: weekly(monday)
        - default: tmdb
          schedule: weekly(wednesday)
        - default: universe
          schedule: weekly(friday)
        - default: year
          schedule: weekly(monday)
      overlay_files:
        - remove_overlays: false
        - default: resolution
        - default: audio_codec
        - default: streaming
        - default: video_format
        - default: ratings
          template_variables:
            rating1: critic
            rating1_image: imdb
            rating2: audience
            rating2_image: rt_popcorn
            rating3: user
            rating3_image: tmdb
        - default: ribbon
      operations:
        schedule: weekly(monday)
        mass_user_rating_update: mdb_tomatoes   # Update user ratings with mdb_tomatoes
        mass_critic_rating_update: imdb         # Update critic ratings with imdb
        mass_audience_rating_update: tmdb       # Update audience ratings with tmdb
    Movies (4K):
      schedule: daily
      report_path: /config/reports/Movies-4K.yml
      template_variables:
        language: "en"
      collection_files:
        - default: actor
          schedule: weekly(tuesday)
        - default: basic
          schedule: weekly(thursday)
        - default: bafta
          schedule: weekly(saturday)
        - default: cannes
          schedule: weekly(tuesday)
        - default: decade
          schedule: weekly(thursday)
        - default: director
          schedule: weekly(saturday)
        - default: franchise
          schedule: weekly(tuesday)
          template_variables:
            data:
              visible_home: true
        - default: genre
          schedule: weekly(thursday)
          template_variables:
            data:
              visible_home: true
        - default: imdb
          schedule: weekly(saturday)
        - default: oscars
          schedule: weekly(tuesday)
          template_variables:
            data:
              starting: current_year-10
              ending: current_year
        - default: seasonal
          schedule: weekly(thursday)
          template_variables:
            data:
              visible_home: true
        - default: streaming
          schedule: weekly(saturday)
        - default: sundance
          schedule: weekly(tuesday)
        - default: tmdb
          schedule: weekly(thursday)
        - default: universe
          schedule: weekly(saturday)
        - default: year
          schedule: weekly(tuesday)
      overlay_files:
        - remove_overlays: false
        - default: resolution
        - default: audio_codec
        - default: streaming
        - default: video_format
        - default: ratings
          template_variables:
            rating1: critic
            rating1_image: imdb
            rating2: audience
            rating2_image: rt_popcorn
            rating3: user
            rating3_image: tmdb
        - default: ribbon
      operations:
        schedule: weekly(tuesday)
        mass_user_rating_update: mdb_tomatoes   # Update user ratings with mdb_tomatoes
        mass_critic_rating_update: imdb         # Update critic ratings with imdb
        mass_audience_rating_update: tmdb       # Update audience ratings with tmdb
    TV Shows:
      schedule: weekly(tuesday|thursday|saturday)
      report_path: /config/reports/TV_Shows-1080p.yml
      template_variables:
        language: en
      collection_files:
        - default: basic
          schedule: weekly(thursday)
        - default: franchise
          schedule: weekly(saturday)
        - default: genre
          schedule: weekly(tuesday)
        - default: network
          schedule: weekly(thursday)
        - default: year
          schedule: weekly(saturday)
      overlay_files:
        - remove_overlays: false
        - default: resolution
        - default: resolution
          template_variables:
            builder_level: season
        - default: resolution
          template_variables:
            builder_level: episode
        - default: audio_codec
        - default: audio_codec
          template_variables:
            builder_level: season
        - default: audio_codec
          template_variables:
            builder_level: episode
        - default: streaming
        - default: video_format
        - default: video_format
          template_variables:
            builder_level: season
        - default: video_format
          template_variables:
            builder_level: episode
        - default: episode_info
          template_variables:
            builder_level: episode
        - default: runtimes
          template_variables:
            builder_level: episode
        - default: ribbon
        - default: ratings
          template_variables:
            rating1: critic
            rating1_image: imdb
            rating2: audience
            rating2_image: rt_popcorn
            rating3: user
            rating3_image: tmdb
        - default: ratings
          schedule: weekly(tuesday)
          template_variables:
            builder_level: episode
            rating1: critic
            rating1_image: imdb
            rating2: audience
            rating2_image: tmdb
      operations:
        schedule: weekly(saturday)
        mass_user_rating_update: mdb_tomatoes   # Update user ratings with mdb_tomatoes
        mass_critic_rating_update: imdb         # Update critic ratings with imdb
        mass_audience_rating_update: tmdb       # Update audience ratings with tmdb
        mass_episode_critic_rating_update: imdb
        mass_episode_audience_rating_update: tmdb
    TV Shows (4K):
      schedule: weekly(monday|wednesday|friday)
      report_path: /config/reports/TV_Shows-4K.yml
      template_variables:
        language: en
      collection_files:
        - default: basic
          schedule: weekly(monday)
        - default: franchise
          schedule: weekly(wednesday)
        - default: genre
          schedule: weekly(friday)
        - default: network
          schedule: weekly(monday)
        - default: year
          schedule: weekly(wednesday)
      overlay_files:
        - remove_overlays: false
        - default: resolution
        - default: resolution
          template_variables:
            builder_level: season
        - default: resolution
          template_variables:
            builder_level: episode
        - default: audio_codec
        - default: audio_codec
          template_variables:
            builder_level: season
        - default: audio_codec
          template_variables:
            builder_level: episode
        - default: streaming
        - default: video_format
        - default: video_format
          template_variables:
            builder_level: season
        - default: video_format
          template_variables:
            builder_level: episode
        - default: episode_info
          template_variables:
            builder_level: episode
        - default: runtimes
          template_variables:
            builder_level: episode
        - default: ribbon
        - default: ratings
          template_variables:
            rating1: critic
            rating1_image: imdb
            rating2: audience
            rating2_image: rt_popcorn
            rating3: user
            rating3_image: tmdb
        - default: ratings
          template_variables:
            builder_level: episode
            rating1: critic
            rating1_image: imdb
            rating2: audience
            rating2_image: tmdb
      operations:
        schedule: weekly(friday)
        mass_user_rating_update: mdb_tomatoes   # Update user ratings with mdb_tomatoes
        mass_critic_rating_update: imdb         # Update critic ratings with imdb
        mass_audience_rating_update: tmdb       # Update audience ratings with tmdb
        mass_episode_critic_rating_update: imdb
        mass_episode_audience_rating_update: tmdb
    Anime Movies:
      schedule: weekly(sunday)
      report_path: /config/reports/Anime_Movies.yml
      template_variables:
        language: en
      collection_files:
        - default: anilist
        - default: basic
        - default: myanimelist
    Anime Series:
      schedule: weekly(sunday)
      report_path: /config/reports/Anime_Series.yml
      template_variables:
        language: en
      collection_files:
        - default: anilist
        - default: basic
        - default: myanimelist

# See https://replit.com/@chazlarson/TraktAuth to generate the auth data.
kometa_trakt: |2
    client_id: {{ vault_kometa_trakt_client_id }}
    client_secret: {{ vault_kometa_trakt_client_secret }}
    pin:
    authorization:
      access_token: {{ vault_kometa_trakt_access_token }}
      token_type: {{ vault_kometa_trakt_token_type }}
      expires_in: {{ vault_kometa_trakt_expires_in }}
      refresh_token: {{ vault_kometa_trakt_refresh_token }}
      scope: {{ vault_kometa_trakt_scope }}
      created_at: {{ vault_kometa_trakt_created_at }}

###
### Navidrome
###
navidrome_base_url: "https://navidrome"

###
### Network
###
docker_macvlans:
  mgmnt:
    name: "mgmt"
    network_parent: "{{ vault_docker_macvlan_mgmt.parent }}"
    enable_ipv6: false
    internal: false
    scope: "local"
    ipam_config:
      - subnet: "{{ vault_docker_macvlan_mgmt.subnet }}"
        gateway: "{{ vault_docker_macvlan_mgmt.gateway }}"
        iprange: "{{ vault_docker_macvlan_mgmt.iprange }}"
  iot:
    name: "iot"
    network_parent: "{{ vault_docker_macvlan_iot.parent }}"
    enable_ipv6: false
    internal: false
    scope: "local"
    ipam_config:
      - subnet: "{{ vault_docker_macvlan_iot.subnet }}"
        gateway: "{{ vault_docker_macvlan_iot.gateway }}"
        iprange: "{{ vault_docker_macvlan_iot.iprange }}"
  nas_macvlan:
    name: "nas_macvlan"
    network_parent: "{{ vault_docker_macvlan_default.parent }}"
    enable_ipv6: false
    internal: false
    scope: "local"
    ipam_config:
      - subnet: "{{ vault_docker_macvlan_default.subnet }}"
        gateway: "{{ vault_docker_macvlan_default.gateway }}"
        iprange: "{{ vault_docker_macvlan_default.iprange }}"
  guest:
    name: "guest"
    network_parent: "{{ vault_docker_macvlan_guest.parent }}"
    enable_ipv6: false
    internal: false
    scope: "local"
    ipam_config:
      - subnet: "{{ vault_docker_macvlan_guest.subnet }}"
        gateway: "{{ vault_docker_macvlan_guest.gateway }}"
        iprange: "{{ vault_docker_macvlan_guest.iprange }}"

###
### Plex
###
# See https://www.plex.tv/claim
r740xd_plex_cpus: 16
r740xd_plex_memory: "16GB"
plex_docker_claim: "{{ vault_plex_docker_claim }}"

###
### Radarr
###
radarr1080_docker_api_key: "{{ vault_radarr1080_docker_api_key }}"
radarr4k_docker_api_key: "{{ vault_radarr4k_docker_api_key }}"

###
### Readarr
###
readarr_api_key: "{{ vault_readarr_api_key }}"

###
### Sonarr
###
sonarr1080_docker_api_key: "{{ vault_sonarr1080_docker_api_key }}"
sonarr4k_docker_api_key: "{{ vault_sonarr4k_docker_api_key }}"

###
### Time Machine
###
time_machine_data_directory: "{{ vault_time_machine_data_directory }}"
time_machine_hostname: "{{ vault_time_machine_hostname }}"
time_machine_network_parent: "{{ vault_time_machine_network_parent }}"
time_machine_network_ipv4: "{{ vault_time_machine_network_ipv4 }}"
r740xd_time_machine_data_directory: "{{ vault_time_machine_data_directory }}"
r740xd_time_machine_hostname: "{{ vault_time_machine_hostname }}"

###
### Veggie Common
###
veggie_domain: "{{ vault_veggie_domain }}"
veggie_fqdn: "{{ veggie_hostname }}.{{ veggie_domain }}"
veggie_hostname: "{{ vault_veggie_hostname }}"
veggie_nas_domain_name: "{{ veggie_fqdn }}"