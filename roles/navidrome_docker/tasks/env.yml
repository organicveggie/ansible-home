---
- name: "{{ navidrome_docker_role_label }} | Define environment variable: {{ __envvar.key }}"
  ansible.builtin.set_fact:
    _navidrome_docker_env: >
      {{ _navidrome_docker_env | default({}, true) | combine({__envvar.key: __envvar.value}) }}
  when: "__envvar.value | default('', true) | length > 0"
