---
- name: "{{ navidrome_docker_role_label }} | Build container FQDN"
  ansible.builtin.set_fact:
    _navidrome_docker_fqdn: "{{ navidrome_docker_hostname }}.{{ navidrome_docker_host_domain }}"

- name: "{{ navidrome_docker_role_label }} | Create navidrome Docker volume"
  community.docker.docker_volume:
    name: "{{ navidrome_docker_volume_name }}"

- name: "{{ navidrome_docker_role_label }} | Set Docker mount list for volume mounts"
  ansible.builtin.set_fact:
    _navidrome_docker_mount_list:
      - source: "{{ navidrome_docker_volume_name }}"
        target: "/data"
        type: "volume"
      - source: "{{ navidrome_docker_music_folder }}"
        read_only: true
        target: "/music"
        type: "bind"

- name: "{{ navidrome_docker_role_label }} | Create placeholder array for default network"
  ansible.builtin.set_fact:
    _navidrome_docker_default_networks:
      - name: "{{ navidrome_docker_network_name }}"
        aliases: "{{ navidrome_docker_network_aliases | default(omit) }}"

- name: "{{ navidrome_docker_role_label }} | Define all Docker networks for this container"
  ansible.builtin.set_fact:
    _navidrome_docker_all_networks: >
      {{ _navidrome_docker_default_networks + navidrome_docker_extra_networks }}

- name: "{{ navidrome_docker_role_label }} | Define common Docker labels"
  ansible.builtin.set_fact:
    _navidrome_docker_labels: "{{ _navidrome_docker_labels | default({}) |
      combine({__item.key: __item.value}) }}"
  with_items:
    - key: "traefik.enable"
      value: "{{ navidrome_docker_available_externally | lower | ternary('true', 'false') }}"
  loop_control:
    loop_var: __item

- name: "{{ navidrome_docker_role_label }} | Configure Docker labels with Traefik enabled"
  when: "navidrome_docker_available_externally"
  block:
    - name: "{{ navidrome_docker_role_label }} | Define Docker labels"
      ansible.builtin.set_fact:
        _navidrome_docker_labels:
          "{{ _navidrome_docker_labels | default({}) |
          combine({__item.key: __item.value}) }}"
      with_items:
        - key: "traefik.http.routers.navidrome.rule"
          value: "Host(`{{ _navidrome_docker_fqdn }}`)"
        - key: "traefik.http.routers.navidrome.entrypoints"
          value: "http,https"
        - key: "traefik.http.routers.navidrome.tls.certresolver"
          value: "letsencrypt"
        - key: "traefik.http.routers.navidrome.tls.domains[0].main"
          value: "*.{{ navidrome_docker_host_domain }}"
        - key: "traefik.http.services.navidrome.loadbalancer.server.port"
          value: "{{ navidrome_docker_web_port }}"
      loop_control:
        loop_var: __item

    - name: "{{ navidrome_docker_role_label }} | Set Traefik network label"
      ansible.builtin.set_fact:
        _navidrome_docker_labels: "{{ _navidrome_docker_labels | default({}) |
          combine({'traefik.docker.network': navidrome_docker_traefik_network}) }}"
      when: "navidrome_docker_traefik_network | default('', true) | length > 0"

- name: "{{ navidrome_docker_role_label }} | Define user-supplied extra Docker labels"
  ansible.builtin.set_fact:
    _navidrome_docker_labels: "{{ _navidrome_docker_labels | default({}) |
      combine({__item.key: __item.value}) }}"
  loop: "{{ navidrome_docker_extra_labels | dict2items }}"
  loop_control:
    loop_var: __item

- name: "{{ navidrome_docker_role_label }} | Define environment variables for this container"
  ansible.builtin.include_tasks: "env.yml"
  loop: "{{ __envvars | dict2items }}"
  loop_control:
    loop_var: "__envvar"
  vars:
    __envvars:
      "ND_BASEURL": "{{ navidrome_docker_base_url | default(omit) }}"
      "ND_CACHEFOLDER": "{{ navidrome_docker_cache_folder | default(omit) }}"
      "ND_ENABLEGRAVATAR": "{{ navidrome_docker_enable_gravatar | default(omit) }}"
      "ND_ENABLESHARING": "{{ navidrome_docker_enable_sharing | default(omit) }}"
      "ND_IMAGECACHESIZE": "{{ navidrome_docker_image_cache_size | default(omit) }}"
      "ND_LOGLEVEL": "{{ navidrome_docker_loglevel | default(omit) }}"
      "ND_PORT": "{{ navidrome_docker_web_port | default(omit) }}"
      "ND_SCANSCHEDULE": "{{ navidrome_docker_scan_schedule | default(omit) }}"
      "ND_SPOTIFY_ID": "{{ navidrome_docker_spotify_client_id | default(omit) }}"
      "ND_SPOTIFY_SECRET": "{{ navidrome_docker_spotify_client_secret | default(omit) }}"
      "ND_TRANSCODINGCACHESIZE": "{{ navidrome_docker_transcoding_cache_size | default(omit) }}"    

- name: "{{ navidrome_docker_role_label }} | Add user specified environment variables"
  ansible.builtin.set_fact:
    _navidrome_docker_env: >
      {{ _navidrome_docker_env | default({}, true) | combine(navidrome_docker_extra_env | default({}, true)) }}

- name: "{{ navidrome_docker_role_label }} | Create Navidrome Docker container" # noqa: args[module]
  community.docker.docker_container:
    name: "{{ navidrome_docker_name }}"
    image: "{{ navidrome_docker_image_name }}:{{ navidrome_docker_image_version }}"
    pull: true
    mounts: "{{ _navidrome_docker_mount_list }}"
    env: "{{ _navidrome_docker_env }}"
    network_mode: "{{ navidrome_docker_network_name }}"
    networks: "{{ _navidrome_docker_all_networks }}"
    restart_policy: unless-stopped
    memory: "{{ navidrome_docker_memory }}"
    cpus: "{{ navidrome_docker_cpus }}"
    container_default_behavior: "no_defaults"
    auto_remove: false
    detach: true
    init: true
    interactive: false
    paused: false
    privileged: false
    read_only: false
    tty: false
    labels: "{{ _navidrome_docker_labels }}"
