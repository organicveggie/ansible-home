---
- name: "{{ tautulli_docker_role_label }} | Create group"
  ansible.builtin.group:
    gid: "{{ tautulli_docker_gid }}"
    name: "{{ tautulli_docker_group_name }}"

- name: "{{ tautulli_docker_role_label }} | Create user"
  ansible.builtin.user:
    create_home: false
    group: "{{ tautulli_docker_group_name }}"
    name: "{{ tautulli_docker_user_name }}"
    password: "!"
    shell: "/usr/bin/false"
    uid: "{{ tautulli_docker_uid }}"

- name: "{{ tautulli_docker_role_label }} | Build container FQDN"
  ansible.builtin.set_fact:
    _tautulli_docker_fqdn: "{{ tautulli_docker_host_name }}.{{ tautulli_docker_host_domain }}"

- name: "{{ tautulli_docker_role_label }} | Create Docker volumes"
  ansible.builtin.include_tasks: "docker_volume.yml"
  loop:
    - "{{ tautulli_docker_volume_config_name }}"
  loop_control:
    loop_var: __tautulli_docker_volume_name

- name: "{{ tautulli_docker_role_label }} | Set Docker mount list for volume mounts"
  ansible.builtin.set_fact:
    _tautulli_docker_mount_list:
      - "source": "{{ tautulli_docker_volume_config_name }}"
        target: "/config"
        "type": 'volume'

- name: "{{ tautulli_docker_role_label }} | Create placeholder array for default network"
  ansible.builtin.set_fact:
    _tautulli_docker_default_networks:
      - name: "{{ tautulli_docker_network_name }}"
        aliases: "{{ tautulli_docker_network_aliases | default(omit) }}"

- name: "{{ tautulli_docker_role_label }} | Define all Docker networks for this container"
  ansible.builtin.set_fact:
    _tautulli_docker_all_networks: >
      {{ _tautulli_docker_default_networks + tautulli_docker_extra_networks }}

- name: "{{ tautulli_docker_role_label }} | Define environment variables for this container"
  ansible.builtin.set_fact:
    _tautulli_docker_env:
      "PGID": "{{ tautulli_docker_gid | string }}"
      "PUID": "{{ tautulli_docker_uid | string }}"
      "TZ": "{{ tautulli_docker_timezone }}"

- name: "{{ tautulli_docker_role_label }} | Add user specified environment variables"
  ansible.builtin.set_fact:
    _tautulli_docker_env: >
      {{ _tautulli_docker_env | default([], true) | combine(tautulli_docker_extra_env | default({}, true)) }}

- name: "{{ tautulli_docker_role_label }} | Define common Docker labels"
  ansible.builtin.set_fact:
    _tautulli_docker_labels: "{{ _tautulli_docker_labels | default({}) |
      combine({__item.key: __item.value}) }}"
  with_items:
    - key: "traefik.enable"
      value: "{{ tautulli_docker_available_externally | lower | ternary('true', 'false') }}"
  loop_control:
    loop_var: __item

- name: "{{ tautulli_docker_role_label }} | Configure Docker labels with Traefik enabled"
  when: "tautulli_docker_available_externally | default(false, true) | bool"
  block:
    - name: "{{ tautulli_docker_role_label }} | Define Docker labels with Traefik enabled"
      ansible.builtin.set_fact:
        _tautulli_docker_labels: "{{ _tautulli_docker_labels | default({}) |
          combine({__item.key: __item.value}) }}"
      with_items:
        - key: "traefik.http.routers.tautulli.rule"
          value: "Host(`{{ _tautulli_docker_fqdn }}`)"
        - key: "traefik.http.routers.tautulli.entrypoints"
          value: "http,https"
        - key: "traefik.http.routers.tautulli.tls.certresolver"
          value: "letsencrypt"
        - key: "traefik.http.routers.tautulli.tls.domains[0].main"
          value: "*.{{ tautulli_docker_host_domain }}"
        - key: "traefik.http.services.tautulli.loadbalancer.server.port"
          value: "{{ tautulli_docker_webui_port }}"
      loop_control:
        loop_var: __item

    - name: "{{ tautulli_docker_role_label }} | Set Traefik network label"
      ansible.builtin.set_fact:
        _tautulli_docker_labels: "{{ _tautulli_docker_labels | default({}) |
          combine({'traefik.docker.network': tautulli_docker_traefik_network}) }}"
      when: "tautulli_docker_traefik_network | default('', true) | length > 0"

- name: "{{ tautulli_docker_role_label }} | Define user-supplied extra Docker labels"
  ansible.builtin.set_fact:
    _tautulli_docker_labels: "{{ _tautulli_docker_labels | default({}) |
      combine({__item.key: __item.value}) }}"
  loop: "{{ tautulli_docker_extra_labels | dict2items }}"
  loop_control:
    loop_var: __item

- name: "{{ tautulli_docker_role_label }} | Check if LinuxServer.io image is being used"
  ansible.builtin.set_fact:
    _tautulli_docker_using_linuxserver_image: "{{ ('lscr.io/linuxserver' in tautulli_docker_image_name) | bool }}"

- name: "{{ tautulli_docker_role_label }} | Create Docker Container"
  community.docker.docker_container:
    name: "{{ tautulli_docker_name }}"
    image: "{{ tautulli_docker_image_name }}:{{ tautulli_docker_image_version }}"
    pull: true
    mounts: "{{ _tautulli_docker_mount_list }}"
    network_mode: "{{ tautulli_docker_network_name }}"
    networks: "{{ _tautulli_docker_all_networks }}"
    env: "{{ _tautulli_docker_env }}"
    etc_hosts: "{{ tautulli_docker_extra_hosts | default(omit) }}"
    restart_policy: unless-stopped
    memory: "{{ tautulli_docker_memory }}"
    cpus: "{{ tautulli_docker_cpus }}"
    container_default_behavior: no_defaults
    auto_remove: no
    detach: yes
    init: "{{ _tautulli_docker_using_linuxserver_image | ternary('no', 'yes') }}"
    interactive: no
    paused: no
    privileged: no
    read_only: no
    tty: no
    labels: "{{ _tautulli_docker_labels }}"
