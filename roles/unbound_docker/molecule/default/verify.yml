---
- name: Verify
  hosts: all
  gather_facts: false

  vars:
    unbound_docker_available_externally: true
    unbound_docker_extra_env:
      "_MOLECULE_TEST": "unbound_docker molecule test value"
    unbound_docker_extra_labels:
      "molecule-label-01": "molecule-value-01"
    unbound_docker_extra_networks:
      - name: "extra-network"
    unbound_docker_name: "unbound_docker-molecule"
    unbound_docker_network_aliases:
      - "zzz-molecule"
    unbound_docker_network_name: "molecule-test-network"
    unbound_docker_config_dir: "/usr/local/unbound_molecule"
    unbound_docker_logs_volume_name: "unbound-logs-molecule"

  tasks:
    - name: "Verify volumes"
      ansible.builtin.include_tasks:
        file: "includes/verify-volume.yml"
      loop:
        - "{{ unbound_docker_logs_volume_name }}"
      loop_control:
        loop_var: "__molecule_volume_name"
    
    - name: Get info on container
      community.docker.docker_container_info:
        name: "{{ unbound_docker_name }}"
      register: _unbound_docker_container

    - name: Verify container exists
      ansible.builtin.assert:
        that:
          - _unbound_docker_container.exists
          - _unbound_docker_container["container"]["State"]["Status"] == "running"

    - name: Verify extra environment variables
      ansible.builtin.assert:
        that:
          - "__env in __all_env"
      vars:
        __all_env: "{{ _unbound_docker_container['container']['Config']['Env'] }}"
        __env: "_MOLECULE_TEST={{ unbound_docker_extra_env['_MOLECULE_TEST'] }}"

    - name: Verify extra labels
      ansible.builtin.assert:
        that:
          - __all_labels["molecule-label-01"] is defined
          - __all_labels["molecule-label-01"] == unbound_docker_extra_labels["molecule-label-01"]
      vars:
        __all_labels: "{{ _unbound_docker_container['container']['Config']['Labels'] }}"

    - name: "Verify networks"
      ansible.builtin.include_tasks:
        file: "includes/verify-network.yml"
      loop:
        - "{{ unbound_docker_network_name }}"
        - "{{ unbound_docker_extra_networks[0].name }}"
      loop_control:
        loop_var: "__molecule_network_name"
      vars:
        __container_id: "{{ _unbound_docker_container['container']['Id'] }}"

    - name: "Verify default network aliases"
      ansible.builtin.assert:
        that:
          - __networks[unbound_docker_network_name]['Aliases'] is defined
          - __role_alias in __networks[unbound_docker_network_name]['Aliases']
      loop: "{{ unbound_docker_network_aliases }}"
      loop_control:
        loop_var: "__role_alias"
      vars:
        __networks: "{{ _unbound_docker_container['container']['NetworkSettings']['Networks'] }}"
