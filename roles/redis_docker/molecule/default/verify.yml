---
- name: Verify
  hosts: all
  gather_facts: false

  vars:
    redis_docker_available_externally: true
    redis_docker_extra_env:
      "_MOLECULE_TEST": "redis_docker molecule test value"
    redis_docker_extra_labels:
      "molecule-label-01": "molecule-value-01"
    redis_docker_extra_networks:
      - name: "extra-network"
    redis_docker_name: "redis_docker-molecule"
    redis_docker_network_aliases:
      - "zzz-molecule"
    redis_docker_network_name: "molecule-test-network"
    redis_docker_volume_name: "redis_docker-molecule-volume"

  tasks:
    - name: "Verify volumes"
      ansible.builtin.include_tasks:
        file: "includes/verify-volume.yml"
      loop:
        - "{{ redis_docker_volume_name }}"
      loop_control:
        loop_var: "__molecule_volume_name"

    - name: Get info on container
      community.docker.docker_container_info:
        name: "{{ redis_docker_name }}"
      register: _container

    - name: Verify container exists
      ansible.builtin.assert:
        that:
          - _container.exists
          - _container["container"]["State"]["Status"] == "running"

    - name: Verify extra environment variables
      ansible.builtin.assert:
        that:
          - "__env in __all_env"
      vars:
        __all_env: "{{ _container['container']['Config']['Env'] }}"
        __env: "_MOLECULE_TEST={{ redis_docker_extra_env['_MOLECULE_TEST'] }}"

    - name: Verify extra labels
      ansible.builtin.assert:
        that:
          - __all_labels["molecule-label-01"] is defined
          - __all_labels["molecule-label-01"] == redis_docker_extra_labels["molecule-label-01"]
      vars:
        __all_labels: "{{ _container['container']['Config']['Labels'] }}"

    - name: "Verify networks"
      ansible.builtin.include_tasks:
        file: "includes/verify-network.yml"
      loop:
        - "{{ redis_docker_network_name }}"
        - "{{ redis_docker_extra_networks[0].name }}"
      loop_control:
        loop_var: "__molecule_network_name"
      vars:
        __container_id: "{{ _container['container']['Id'] }}"

    - name: "Verify default network aliases"
      ansible.builtin.assert:
        that:
          - __networks[redis_docker_network_name]['Aliases'] is defined
          - __role_alias in __networks[redis_docker_network_name]['Aliases']
      loop: "{{ redis_docker_network_aliases }}"
      loop_control:
        loop_var: "__role_alias"
      vars:
        __networks: "{{ _container['container']['NetworkSettings']['Networks'] }}"
