---
- name: "Get info on {{ __molecule_network.name }} network"
  community.docker.docker_network_info:
    name: "{{ __molecule_network.name }}"
  register: __netinfo

- name: "Verify {{ __molecule_network.name }} network exists"
  ansible.builtin.assert:
    that: __netinfo.exists

- name: "Verify {{ __molecule_network.name }} is attached to container"
  ansible.builtin.assert:
    that:
      - __netinfo['network']['Containers'][__container_id] is defined
      - __netinfo['network']['Containers'][__container_id]['Name'] is defined

- name: "Verify container has IPv4 address"
  when: "__ipv4_network.name == __molecule_network.name"
  block:
    - name: "Verify container has IPAMConfig on {{ __molecule_network.name }}"
      ansible.builtin.assert:
        that: __container_networks[__molecule_network.name]['IPAMConfig'] | default({}, true) | length > 0

    - name: "Verify container has IPv4 address on {{ __molecule_network.name }}"
      ansible.builtin.assert:
        that: __container_networks[__molecule_network.name]['IPAMConfig']['IPv4Address'] == __ipv4_network.ipv4_address
