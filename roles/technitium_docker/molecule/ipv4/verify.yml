---
- name: Verify
  hosts: all
  gather_facts: false

  vars:
    __networks:
      - name: "molecule-test-network"
        driver: "bridge"
        internal: false
        ipam_config:
          - subnet: "172.20.10.0/24"
      - name: "molecule-ingress-network"
        driver: "bridge"
        ipam_config:
          - subnet: "172.20.20.0/24"

    technitium_docker_admin_password: "abc123"
    technitium_docker_available_externally: true
    technitium_docker_config_volume_name: "molecule-technitium-cfg"
    technitium_docker_extra_networks:
      - name: "{{ __networks[1].name }}"
    technitium_docker_default_network:
      name: "{{ __networks[0].name }}"
      ipv4_address: "172.20.10.10"
    technitium_docker_logs_volume_name: "molecule-technitium-logs"
    technitium_docker_name: "technitium_docker-molecule"
    technitium_docker_server_forwarders:
      - "8.8.8.8"
      - "1.1.1.1"
    technitium_docker_server_forwarder_protocol: "tcp"
    technitium_docker_traefik_network: "{{ technitium_docker_extra_networks[1].name }}"

  tasks:
    - name: "Verify volumes"
      ansible.builtin.include_tasks:
        file: "../includes/verify-volume.yml"
      loop:
        - "{{ technitium_docker_config_volume_name }}"
        - "{{ technitium_docker_logs_volume_name }}"
      loop_control:
        loop_var: "__molecule_volume_name"

    - name: Get info on container
      community.docker.docker_container_info:
        name: "{{ technitium_docker_name }}"
      register: _technitium_docker_container

    - name: Verify container exists
      ansible.builtin.assert:
        that:
          - _technitium_docker_container.exists
          - _technitium_docker_container["container"]["State"]["Status"] == "running"

    - name: Define environment variables to check
      ansible.builtin.set_fact:
        _technitium_docker_env_vars:
          "DNS_SERVER_LOG_FOLDER_PATH": "/var/log/technitium/dns"
          "DNS_SERVER_ADMIN_PASSWORD": "{{ technitium_docker_admin_password }}"
          "DNS_SERVER_FORWARDERS": "8.8.8.8, 1.1.1.1"

    - name: Verify environment variables
      ansible.builtin.include_tasks:
        file: "../includes/verify-env.yml"
      loop: "{{ _technitium_docker_env_vars | dict2items }}"
      loop_control:
        loop_var: "__item"

    - name: "Verify networks"
      ansible.builtin.include_tasks:
        file: "verify-network.yml"
      loop: "{{ __networks }}"
      loop_control:
        loop_var: "__molecule_network"
      vars:
        __container_id: "{{ _technitium_docker_container['container']['Id'] }}"
        __container_networks: "{{ _technitium_docker_container['container']['NetworkSettings']['Networks'] }}"
        __ipv4_network: "{{ technitium_docker_default_network }}"
