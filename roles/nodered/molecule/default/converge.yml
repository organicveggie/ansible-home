---
- name: Install dependencies
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Wait for systemd to complete initialization
      ansible.builtin.command: systemctl is-system-running
      register: systemctl_status
      until: >
        'running' in systemctl_status.stdout or
        'degraded' in systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_facts["service_mgr"] == 'systemd'
      changed_when: false
      failed_when: systemctl_status.rc > 1

- name: Converge  # noqa: command-instead-of-module var-naming[no-role-prefix]
  hosts: all
  become: true

  vars:
    nodered_credential_secret: "molecule-test-secret-credential"
    nodered_docker_extra_env:
      "NODERED_MOLECULE_TEST": "nodered molecule test value"
    nodered_docker_extra_labels:
      "molecule-label-01": "molecule-value-01"
    nodered_docker_extra_networks:
      - name: "ingress-proxy-test"
    nodered_docker_name: "nodered-molecule"
    nodered_docker_network_aliases:
      - "nr-molecule"
    nodered_docker_network_name: "nodered-network-test"
    nodered_docker_volume_name: "nodered-data-test"
    nodered_hostname: "nodered-molecule-test"

  pre_tasks:
    - name: Install Docker
      ansible.builtin.include_role:
        name: geerlingguy.docker

    - name: Create Docker test networks
      community.docker.docker_network:
        name: "{{ __item.name }}"
        state: present
      loop: >
        {{ nodered_docker_extra_networks + [{'name': nodered_docker_network_name}] }}
      loop_control:
        loop_var: "__item"

  roles:
    - role: nodered
