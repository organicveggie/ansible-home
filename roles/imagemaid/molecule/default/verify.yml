---
- name: Verify
  hosts: all
  gather_facts: false

  vars:
    imagemaid_available_externally: true
    imagemaid_extra_env:
      "_MOLECULE_TEST": "imagemaid molecule test value"
    imagemaid_extra_labels:
      "molecule-label-01": "molecule-value-01"
    imagemaid_extra_networks:
      - name: "extra-network"
    imagemaid_name: "imagemaid-molecule"
    imagemaid_network_aliases:
      - "zzz-molecule"
    imagemaid_network_name: "molecule-test-network"
    imagemaid_volume_name: "imagemaid-molecule-volume"
    imagemaid_host_plex_path: "/opt/fake-plex"
    imagemaid_plex_token: "fake-plex-token"

  tasks:
    - name: "Verify volumes"
      ansible.builtin.include_tasks:
        file: "includes/verify-volume.yml"
      loop:
        - "{{ imagemaid_volume_name }}"
      loop_control:
        loop_var: "__molecule_volume_name"

    - name: Get info on container
      community.docker.docker_container_info:
        name: "{{ imagemaid_name }}"
      register: _imagemaid_container

    - name: Verify container exists
      ansible.builtin.assert:
        that:
          - _imagemaid_container.exists
          - _imagemaid_container["container"]["State"]["Status"] == "running"

    - name: Verify extra environment variables
      ansible.builtin.include_tasks:
        file: "includes/verify-envvar.yml"
      loop: "{{ __imagemaid_env_vars | dict2items }}"
      loop_control:
        loop_var: "__item"
      vars:
        __container: "{{ _imagemaid_container }}"
        __imagemaid_env_vars:
          _MOLECULE_TEST: "{{ imagemaid_extra_env['_MOLECULE_TEST'] }}"
          CLEAN_BUNDLES: "True"
          EMPTY_TRASH: "True"
          OPTIMIZE_DB: "True"
          PHOTO_TRANSCODER: "True"
          PLEX_TOKEN: "{{ imagemaid_plex_token }}"
          SCHEDULE: "05:00|monthly(31)"

    - name: Verify extra labels
      ansible.builtin.assert:
        that:
          - __all_labels["molecule-label-01"] is defined
          - __all_labels["molecule-label-01"] == imagemaid_extra_labels["molecule-label-01"]
      vars:
        __all_labels: "{{ _imagemaid_container['container']['Config']['Labels'] }}"

    - name: "Verify networks"
      ansible.builtin.include_tasks:
        file: "includes/verify-network.yml"
      loop:
        - "{{ imagemaid_network_name }}"
        - "{{ imagemaid_extra_networks[0].name }}"
      loop_control:
        loop_var: "__molecule_network_name"
      vars:
        __container_id: "{{ _imagemaid_container['container']['Id'] }}"

    - name: "Verify default network aliases"
      ansible.builtin.assert:
        that:
          - __networks[imagemaid_network_name]['Aliases'] is defined
          - __role_alias in __networks[imagemaid_network_name]['Aliases']
      loop: "{{ imagemaid_network_aliases }}"
      loop_control:
        loop_var: "__role_alias"
      vars:
        __networks: "{{ _imagemaid_container['container']['NetworkSettings']['Networks'] }}"
